<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order Status | POLYMATH DATA HUB</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="apple-touch-icon" href="/img/icon-192.png" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📶</text></svg>" />
<link rel="stylesheet" href="/css/style.css?v=73" />
<style>
  /* Specific styles for the completion page */
  .status-container { text-align: center; padding: 20px; }
  .status-icon { font-size: 64px; margin-bottom: 16px; transition: all 0.3s ease; }
  .status-title { font-size: 1.5rem; margin-bottom: 8px; }
  .status-detail { color: var(--muted); max-width: 460px; margin: 0 auto 24px; line-height: 1.5; }
  /* Shown on an order that has been queuing a while (see showWaitNote in complete.js).
     Reads as reassurance, not as an error, so it is a quiet bordered box rather than
     red text. */
  .wait-note { max-width: 460px; margin: 0 auto 24px; padding: 14px 18px; text-align: left;
    background: #fffbeb; border: 1px solid #fde68a; border-left: 4px solid #d97706;
    border-radius: 10px; color: #78350f; font-size: 14px; line-height: 1.6; }
  .ref-display { font-family: monospace; background: var(--bg-elevated); padding: 8px 16px; border-radius: 8px; display: inline-block; margin: 16px 0; font-size: 1.1rem; letter-spacing: 0.5px; }
  
  body.status-success .status-icon { color: #2ecc71; }
  body.status-error .status-icon { color: #e74c3c; }
  body.status-pending .status-icon { color: #f39c12; }

  .input-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  .input-group input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; text-align: center; letter-spacing: 4px; max-width: 120px; }
</style>
<meta name="theme-color" content="#0e7490" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<main id="main" class="cta" style="min-height:100vh;display:grid;place-items:center;text-align:center;padding: 20px;">
  <div class="wrap narrow status-container">
    <div class="status-icon" id="statusIcon">⏳</div>
    <h1 class="status-title" id="statusTitle">Verifying Payment…</h1>
    <p class="status-detail" id="statNote">We are checking the status of your order. This usually takes a few moments.</p>
    <div id="progressTrack" class="progress-track" aria-label="Order progress"></div>
    
    <div class="ref-display">Order Reference: <b id="refHere">n/a</b></div>

    <div class="input-group" id="phoneInputGroup" hidden>
      <input type="text" id="phoneSuffixInput" maxlength="4" pattern="[0-9]*" inputmode="numeric" placeholder="Last 4 digits" aria-label="Last 4 digits of phone number">
      <button type="button" class="btn btn-primary" id="verifyBtn">Verify Status</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-top:24px">
      <a class="btn btn-light" id="waLink" href="#" target="_blank" rel="noopener" hidden>Questions? WhatsApp Support</a>
      <a class="btn btn-primary" href="/account">View Order History</a>
      <a class="btn btn-light" href="/">← Back to Shop</a>
    </div>
  </div>
</main>

<script src="/js/complete.js?v=9"></script>
</body>
</html>
