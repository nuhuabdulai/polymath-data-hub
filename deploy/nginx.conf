# nginx in front of the storefront.
#
#   install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/polymath-data-hub
#             sudo ln -s /etc/nginx/sites-available/polymath-data-hub /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo systemctl reload nginx
#             sudo certbot --nginx -d bundles.example.com     # gets the certificate
#
# Why a proxy at all, when Express could bind 0.0.0.0:
#   - TLS. Paystack will not call back over http, and neither will iDATA's webhook.
#   - The app reads X-Forwarded-Proto to decide on the HTTPS redirect and whether to
#     set Secure on cookies (see the HTTPS/redirect middleware), and reads
#     X-Forwarded-For for the rate limiter's key. Both are set below, and the app is
#     configured to trust a proxy on loopback only, so a client cannot forge them.
#   - Edge protection: slow-loris and body-size limits before Node sees the request.
#
# Replace bundles.example.com with the real hostname, and the certificate paths if you
# are not using certbot.

# Keep the app's own rate limiter as the source of truth; this is only a flood guard
# so a single source cannot exhaust Node's event loop.
limit_req_zone $binary_remote_addr zone=storefront_all:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=storefront_login:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name bundles.example.com;
    # certbot rewrites this block to redirect to https; keep the ACME path reachable.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bundles.example.com;

    ssl_certificate     /etc/letsencrypt/live/bundles.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bundles.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The app sends HSTS itself; this is for the very first response, before the
    # middleware has run. Kept identical so there is only one policy to reason about.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 64k;        # the app accepts 50kb of JSON; leave a little
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 20s;

    access_log /var/log/nginx/polymath-access.log;
    error_log  /var/log/nginx/polymath-error.log;

    # The supplier's delivery webhook and Paystack's charge webhook must reach the app
    # untouched: their signatures are computed over the exact bytes of the body, so
    # nothing here may rewrite or buffer it into a different shape.
    location = /api/idatagh/webhook { proxy_pass http://127.0.0.1:4000; include /etc/nginx/proxy_params_polymath; }
    location = /api/paystack/webhook { proxy_pass http://127.0.0.1:4000; include /etc/nginx/proxy_params_polymath; }

    # Sign-in gets a stricter edge limit than the rest of the site.
    location = /api/admin/login {
        limit_req zone=storefront_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params_polymath;
    }

    location / {
        limit_req zone=storefront_all burst=40 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params_polymath;
    }
}

# The headers the app depends on. Kept in their own snippet so they cannot drift
# between locations.
#
#   sudo tee /etc/nginx/proxy_params_polymath >/dev/null <<'PARAMS'
#   proxy_http_version 1.1;
#   proxy_set_header Host              $host;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_set_header Upgrade           $http_upgrade;
#   proxy_set_header Connection        "";
#   proxy_read_timeout 30s;
#   proxy_connect_timeout 5s;
#   PARAMS
